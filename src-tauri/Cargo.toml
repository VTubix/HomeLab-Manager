[package]
name = "homelab_manager"
version = "0.3.0"
edition = "2021"

[lib]
name = "homelab_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Credentials are kept in the OS credential store (Windows Credential Manager / Linux Secret Service).
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service"] }
